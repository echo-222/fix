# 有域名证书以后的 /etc/nginx/conf.d/dongle.conf（deploy/https.sh domain 会把 __DOMAIN__ 换成真实域名再放好）
# http 和 https://<服务器 IP> 都跳到 https://__DOMAIN__/dongle/

upstream dongle_api {
  server 127.0.0.1:3000;
  keepalive 16;
}

server {
  listen 80 default_server;
  listen [::]:80 default_server;
  server_name __DOMAIN__;

  location ^~ /.well-known/acme-challenge/ {
    root /srv/dongle/acme;
  }

  location / {
    return 301 https://__DOMAIN__$request_uri;
  }
}

# 443 的 default_server 在下面的 IP 那段：直接用 IP 访问时浏览器不带 SNI，落到默认 server，要拿到 IP 证书
# （没有 IP 证书时那段会被删掉，这里就是 443 上唯一的 server）
server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name __DOMAIN__;

  ssl_certificate /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_session_cache shared:dongle_ssl:10m;
  ssl_session_timeout 1d;

  add_header Strict-Transport-Security "max-age=31536000" always;

  include /etc/nginx/dongle-site.conf;
}

# ip-begin（服务器上没有 IP 证书时 https.sh 会删掉这一段）
server {
  listen 443 ssl default_server;
  listen [::]:443 ssl default_server;
  http2 on;
  server_name __IP__;

  ssl_certificate /etc/letsencrypt/live/ip/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/ip/privkey.pem;

  # 以前发出去的 https://<IP>/?invite=… 这类链接在根路径下，接到 /dongle/ 后面
  location / {
    return 301 https://__DOMAIN__/dongle$request_uri;
  }
  location /dongle/ {
    return 301 https://__DOMAIN__$request_uri;
  }
}
# ip-end
