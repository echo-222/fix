# 装到服务器的 /etc/nginx/dongle-site.conf：80 和 443 两个 server 共用的部分
# 站点挂在 /dongle/ 下（前端打包时 BASE_PATH=/dongle/，见 deploy.sh）：
#   静态文件：/srv/dongle/www/dongle 是指向 /srv/dongle/current/dist 的软链接（deploy.sh 建好）
#   /dongle/api/ 和 /dongle/imported/（网页导入的说明书，按账号过滤）去掉 /dongle 前缀转给本机 3000 端口的 Node

root /srv/dongle/www;
index index.html;
charset utf-8;
server_tokens off;

# 笔记配图上传是 base64 JSON，单张最多约 8.5 MB
client_max_body_size 10m;

gzip on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_vary on;
gzip_proxied any;
gzip_types text/css application/javascript application/json image/svg+xml model/gltf-binary application/octet-stream text/plain;

add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
# 下面的 location 里还有自己的 add_header：merge 让这两条和外层的（https 的 HSTS）照样带上，不被覆盖（nginx 1.29.3+）
add_header_inherit merge;

# 域名根目录暂时没别的东西，先跳到 /dongle/（以后放别的站点时改这里）
location = / {
  return 302 /dongle/$is_args$args;
}

location = /dongle {
  return 301 /dongle/$is_args$args;
}

# ^~：上传的图片是 /dongle/api/community/media/<哈希>.webp，不能被下面按扩展名匹配的静态规则截走
# 管理后台的实时动态是 SSE，不能缓冲，也别超时断开。其它接口保持默认缓冲：
# 关掉缓冲后响应没有 Content-Length，iOS（尤其微信、飞书）读 HTTP/2 响应会失败，页面上就是 Load failed
location = /dongle/api/admin/stream {
  proxy_pass http://dongle_api/api/admin/stream;
  proxy_http_version 1.1;
  proxy_set_header Connection "";
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Forwarded-Prefix /dongle;
  proxy_buffering off;
  gzip off;
  proxy_read_timeout 1h;
  proxy_send_timeout 1h;
}

location ^~ /dongle/api/ {
  # 上传说明书生成 3D 说明书（PDF 拆成的页面图 + 产品照片）最多 80 MB；各接口自己的上限在 Node 那边（server/aiPlugin.ts、server/http.ts）
  client_max_body_size 80m;
  proxy_pass http://dongle_api/api/;
  proxy_http_version 1.1;
  proxy_set_header Connection "";
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Forwarded-Prefix /dongle;
  proxy_read_timeout 1h;
  proxy_send_timeout 1h;
}
# 网页导入的说明书（数据在 /var/lib/dongle/imported）：没发布的只有导入的人看得到，所以也走 Node
location ^~ /dongle/imported/ {
  proxy_pass http://dongle_api/imported/;
  proxy_http_version 1.1;
  proxy_set_header Connection "";
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Forwarded-Prefix /dongle;
}

# 打包后的 JS / CSS 文件名带哈希，可以永久缓存
location ^~ /dongle/assets/ {
  expires 1y;
  add_header Cache-Control "public, immutable";
  try_files $uri =404;
}

location ~* ^/dongle/.+\.(?:glb|gltf|webp|png|jpe?g|svg|ico|woff2?|json|mjs|wasm|pdf)$ {
  expires 7d;
  try_files $uri =404;
}

location = /dongle/index.html {
  add_header Cache-Control "no-cache";
}

location /dongle/ {
  add_header Cache-Control "no-cache";
  try_files $uri $uri/ /dongle/index.html;
}
