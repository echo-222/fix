# 域名还没备案时用服务器 IP 上 https（deploy/https.sh ip）：Let's Encrypt 的 IP 证书，6 天有效，自动续
# 装到服务器的 /etc/nginx/conf.d/dongle.conf；80 端口的内容在 /etc/nginx/dongle-http.conf（先照常出站点，确认 443 通了再换成跳转）

upstream dongle_api {
  server 127.0.0.1:3000;
  keepalive 16;
}

server {
  listen 80 default_server;
  listen [::]:80 default_server;
  server_name gulugulu.tripolabs.com;

  location ^~ /.well-known/acme-challenge/ {
    root /srv/dongle/acme;
  }

  include /etc/nginx/dongle-http.conf;
}

server {
  listen 443 ssl default_server;
  listen [::]:443 ssl default_server;
  http2 on;

  ssl_certificate /etc/letsencrypt/live/ip/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/ip/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_session_cache shared:dongle_ssl:10m;
  ssl_session_timeout 1d;

  include /etc/nginx/dongle-site.conf;
}
