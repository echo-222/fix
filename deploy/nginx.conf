# 装到服务器的 /etc/nginx/conf.d/dongle.conf（deploy/setup-server.sh 会放好）
# 站点在 /dongle/ 下（见 site.conf）：静态文件直接由 nginx 出，/dongle/api/ 转给本机 3000 端口的 Node（systemd 服务 dongle）。
# 有了证书以后 deploy/https.sh 会换成 nginx-https.conf。

upstream dongle_api {
  server 127.0.0.1:3000;
  keepalive 16;
}

server {
  listen 80 default_server;
  listen [::]:80 default_server;
  server_name gulugulu.tripolabs.com;

  location ^~ /.well-known/acme-challenge/ {
    root /srv/dongle/acme;
  }

  include /etc/nginx/dongle-site.conf;
}
