<!doctype html>
<html lang="zh-CN">
  <head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <title>懂了 Dongle · 3D 说明书社区</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- 等待页写在 HTML 里：脚本还没下载完就能看到，main.tsx 渲染好首屏后淡出。和全站一样：纯白底，凸起 / 凹陷靠阴影，辅助色黑、灰、奶黄 -->
    <style>
      #splash {
        position: fixed;
        inset: 0;
        z-index: 1000;
        display: flex;
        overflow-y: auto;
        background: #fff;
        color: #161616;
        font-family: 'Inter', 'SF Pro Text', -apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
        transition: opacity 0.45s ease, visibility 0.45s;
      }
      #splash.is-out { opacity: 0; visibility: hidden; }
      .splash-inner { display: flex; flex-direction: column; align-items: center; margin: auto; padding: 24px 0; transform: translateY(-4vh); transition: transform 0.45s ease; }
      /* 没登录：等待页原地变成登录页。灯泡停在亮着的样子（不要光晕，和 logo.svg 一样）、缩小一点，进度条换成登录表单（main.tsx 往 #splash-auth 里渲染） */
      #splash.is-auth .splash-inner { transform: none; }
      #splash.is-auth .splash-art { width: 96px; height: 96px; }
      #splash.is-auth .splash-art * { animation: none !important; }
      #splash.is-auth .splash-art .halo { opacity: 0; }
      #splash.is-auth .splash-art .ray { stroke-dashoffset: 0; }
      #splash.is-auth .splash-brand { margin-top: 22px; }
      #splash.is-auth .splash-bar, #splash.is-auth .splash-tip { display: none; }
      #splash:not(.is-auth) #splash-auth { display: none; }
      #splash.is-offline .splash-bar i { animation: none; left: 31%; background: #d0d0cc; box-shadow: none; }
      .splash-tip a { color: #161616; font-weight: 700; }
      /* 灯泡落下，灯丝一笔笔写出发光的 dongle；写完玻璃亮起、背后起光晕，五道光芒从中间往两边画出来 = 「懂了」。
         icons:start / icons:end 之间（灯丝三笔的 keyframes、整个 SVG）由 npm run icons 生成，别手改 */
      .splash-art { width: 112px; height: 112px; overflow: visible; transition: width 0.45s ease, height 0.45s ease; }
      .splash-art .bulb { animation: splash-bulb 3.2s cubic-bezier(0.65, 0, 0.35, 1) infinite both; }
      .splash-art .glass { fill: #f8e8a8; animation: splash-glass 3.2s ease infinite both; }
      .splash-art .halo { fill: #f8e8a8; opacity: 0; filter: blur(1.2px); transform-box: fill-box; transform-origin: center; animation: splash-halo 3.2s ease-out infinite both; }
      .splash-art .fil use { stroke-dasharray: 1; animation: 3.2s linear infinite both; }
      .splash-art .fil .w0 { animation-name: splash-w0; }
      .splash-art .fil .w1 { animation-name: splash-w1; }
      .splash-art .fil .w2 { animation-name: splash-w2; }
      .splash-art .ray { fill: none; stroke: #161616; stroke-width: 0.9; stroke-linecap: round; stroke-dasharray: 1; animation: splash-ray 3.2s ease-out infinite both; }
      .splash-art .r1, .splash-art .r3 { animation-delay: 0.06s; }
      .splash-art .r0, .splash-art .r4 { animation-delay: 0.12s; }
      @keyframes splash-bulb {
        0% { transform: translateY(-2.4px); opacity: 0; }
        10% { opacity: 1; }
        14% { transform: translateY(0.3px); }
        18%, 82% { transform: none; opacity: 1; }
        96%, 100% { transform: translateY(-2.4px); opacity: 0; }
      }
      @keyframes splash-glass {
        0%, 52% { fill: #efefec; }
        56%, 82% { fill: #f8e8a8; }
        90%, 100% { fill: #efefec; }
      }
      @keyframes splash-halo {
        0%, 52% { opacity: 0; transform: scale(0.7); }
        62%, 78% { opacity: 0.85; transform: scale(1.12); }
        90%, 100% { opacity: 0; transform: scale(0.8); }
      }
      /* icons:start */
      @keyframes splash-w0 {
        0%, 18% { stroke-dashoffset: 1; opacity: 0; }
        18.3% { opacity: 1; }
        25.26%, 82% { stroke-dashoffset: 0; opacity: 1; }
        92%, 100% { stroke-dashoffset: 0; opacity: 0; }
      }
      @keyframes splash-w1 {
        0%, 26.46% { stroke-dashoffset: 1; opacity: 0; }
        26.76% { opacity: 1; }
        35.25%, 82% { stroke-dashoffset: 0; opacity: 1; }
        92%, 100% { stroke-dashoffset: 0; opacity: 0; }
      }
      @keyframes splash-w2 {
        0%, 36.45% { stroke-dashoffset: 1; opacity: 0; }
        36.75% { opacity: 1; }
        52%, 82% { stroke-dashoffset: 0; opacity: 1; }
        92%, 100% { stroke-dashoffset: 0; opacity: 0; }
      }
      /* icons:end */
      @keyframes splash-ray {
        0%, 54% { stroke-dashoffset: 1; opacity: 0; }
        56% { opacity: 1; }
        64%, 78% { stroke-dashoffset: 0; opacity: 1; }
        88%, 100% { stroke-dashoffset: -1; opacity: 0; }
      }
      .splash-brand { margin-top: 30px; font-size: 22px; font-weight: 900; letter-spacing: 3px; }
      .splash-brand small { margin-left: 6px; font-size: 13px; font-weight: 800; letter-spacing: 1px; color: #a8a8a8; }
      .splash-sub { margin-top: 6px; font-size: 12px; color: #a8a8a8; letter-spacing: 1px; }
      .splash-bar {
        position: relative;
        width: 148px;
        height: 10px;
        margin-top: 22px;
        border-radius: 10px;
        background: #f5f5f3;
        box-shadow: inset 2px 2px 5px rgba(0, 0, 0, 0.1), inset -2px -2px 5px #fff;
        overflow: hidden;
      }
      .splash-bar i { position: absolute; top: 2px; bottom: 2px; width: 38%; border-radius: 6px; background: #161616; box-shadow: 1px 1px 3px rgba(0, 0, 0, 0.3); animation: splash-bar 1.4s cubic-bezier(0.65, 0, 0.35, 1) infinite; }
      @keyframes splash-bar { from { left: -40%; } to { left: 100%; } }
      .splash-tip { margin-top: 12px; font-size: 11.5px; color: #a8a8a8; min-height: 1em; }
      @media (prefers-reduced-motion: reduce) {
        .splash-art *, .splash-bar i { animation: none !important; }
        .splash-art .halo { opacity: 0.85; transform: scale(1.12); }
        .splash-art .ray { stroke-dashoffset: 0; }
        .splash-bar i { left: 30%; }
      }
    </style>
